<div class="shell">
  <header class="topbar">
    <span class="brand">{{ title }}</span>
    <nav class="nav">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-btn">儀表板</a>
      <a routerLink="/projects" routerLinkActive="active" class="nav-btn">專案列表</a>
      <a routerLink="/members" routerLinkActive="active" class="nav-btn">成員管理</a>
    </nav>
    <div class="user-area">
      <span class="user-name">{{ currentUserName }}</span>
      <button type="button" class="logout-btn" (click)="logout()">登出</button>
    </div>
  </header>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
